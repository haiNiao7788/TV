              ico.save(f'/tmp/{name}')
          print('Assets generated successfully!')
          "

      - name: Download Official FongMi 5.7.2 Leanback APKs
        run: |
          mkdir -p /tmp/bases
          curl -L -o /tmp/bases/arm64.apk 'https://github.com/FongMi/Release/releases/download/5.7.2/leanback-arm64_v8a.apk'
          curl -L -o /tmp/bases/v7a.apk 'https://github.com/FongMi/Release/releases/download/5.7.2/leanback-armeabi_v7a.apk'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore /tmp/caleb.jks -alias caleb -keyalg RSA -keysize 2048 -validity 10000 -storepass calebtv -keypass calebtv -dname 'CN=Caleb, OU=TV, O=Apple, L=Shanghai, S=Shanghai, C=CN'

      - name: Rebrand & Package APKs
        run: |
          mkdir -p output
          for arch in arm64 v7a; do
            echo "=== Processing $arch ==="
            java -jar /tmp/apktool.jar d -f -r /tmp/bases/$arch.apk -o /tmp/apk_$arch
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Caleb<\/string>/g' $(find /tmp/apk_$arch/res -name "strings.xml")
            find /tmp/apk_$arch/res -name "*banner*.png" -exec cp /tmp/banner_640x360.png {} +
            find /tmp/apk_$arch/res -name "*ic_launcher*.png" -exec cp /tmp/ic_192.png {} +
            find /tmp/apk_$arch/res -name "*ic_launcher_round*.png" -exec cp /tmp/ic_192.png {} +
            find /tmp/apk_$arch/res -name "*ic_launcher_round*.webp" -exec cp /tmp/ic_192.png {} +
            java -jar /tmp/apktool.jar b /tmp/apk_$arch -o /tmp/unaligned_$arch.apk
            zipalign -p -f -v 4 /tmp/unaligned_$arch.apk /tmp/aligned_$arch.apk
            apksigner sign --ks /tmp/caleb.jks --ks-pass pass:calebtv --key-pass pass:calebtv --out output/Caleb-TV-$arch.apk /tmp/aligned_$arch.apk
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caleb-TV-APK
          path: output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fongmi'
        with:
          tag_name: v1.0.0-Caleb
          name: Caleb TV v1.0.0
          body: |
            ## 🎬 Caleb TV 专属投影仪版
            - **视觉设计**：全新 Apple 极简风格，霓虹发光 Caleb 专属图标与大屏 16:9 横版海报
            - **应用名称**：Caleb
            - **底层引擎**：基于 FongMi 5.7.2 纯净硬解内核，支持 4K HDR、杜比视界及遥控器丝滑操控
            - **架构支持**：
              - `Caleb-TV-arm64.apk`：适用于主流 64 位高性能投影仪及电视盒（极米、当贝、小米等）
              - `Caleb-TV-v7a.apk`：适用于 32 位通用电视/投影芯片
          files: output/*.apk
