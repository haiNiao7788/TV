          from PIL import Image

          raw = Image.open('/tmp/caleb_raw.png').convert('RGBA')

          # 1. Generate TV Banners (16:9 ratio, Apple-grade centered neon glow on pure white)
          for w, h, name in [(640, 360, 'banner_640x360.png'), (320, 180, 'banner_320x180.png')]:
              banner = Image.new('RGBA', (w, h), (255, 255, 255, 255))
              logo_side = int(h * 0.92)
              resized = raw.resize((logo_side, logo_side), Image.Resampling.LANCZOS)
              x = (w - logo_side) // 2
              y = (h - logo_side) // 2
              banner.paste(resized, (x, y), resized)
              banner.save(f'/tmp/{name}')

          # 2. Generate Multi-Density Icons
          for sz, name in [
              (48, 'ic_48.png'), (72, 'ic_72.png'), (96, 'ic_96.png'),
              (144, 'ic_144.png'), (192, 'ic_192.png'), (512, 'ic_512.png')
          ]:
              ico = raw.resize((sz, sz), Image.Resampling.LANCZOS)
              ico.save(f'/tmp/{name}')
          print('Assets generated successfully!')
          PYEOF

      - name: Download Official FongMi 5.7.2 Leanback APKs
        run: |
          mkdir -p /tmp/bases
          curl -L -o /tmp/bases/arm64.apk 'https://github.com/FongMi/Release/releases/download/5.7.2/leanback-arm64_v8a.apk'
          curl -L -o /tmp/bases/v7a.apk 'https://github.com/FongMi/Release/releases/download/5.7.2/leanback-armeabi_v7a.apk'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore /tmp/caleb.jks -alias caleb -keyalg RSA -keysize 2048 -validity 10000 -storepass calebtv -keypass calebtv -dname 'CN=Caleb, OU=TV, O=Apple, L=Shanghai, S=Shanghai, C=CN'

      - name: Rebrand & Package APKs
        run: |
          mkdir -p output

          for arch in arm64 v7a; do
            echo "=== Processing  ==="
            java -jar /tmp/apktool.jar d -f -r /tmp/bases/.apk -o /tmp/apk_

            # Update App Names in all string resources
            python3 - << PYSTR
import os, re

target_dir = f'/tmp/apk_/res'

for root, dirs, files in os.walk(target_dir):
    for f in files:
        if f == 'strings.xml':
            p = os.path.join(root, f)
            with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                content = fp.read()
            new_content = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Caleb</string>', content)
            with open(p, 'w', encoding='utf-8') as fp:
                fp.write(new_content)
PYSTR

            # Replace TV Banners & Icons across all resource directories
            find /tmp/apk_/res -name "*banner*.png" -exec cp /tmp/banner_640x360.png {} \;
            find /tmp/apk_/res -name "*ic_launcher*.png" -exec cp /tmp/ic_192.png {} \;
            find /tmp/apk_/res -name "*ic_launcher_round*.png" -exec cp /tmp/ic_192.png {} \;
            find /tmp/apk_/res -name "*ic_launcher_round*.webp" -exec cp /tmp/ic_192.png {} \;

            # Build modified APK
            java -jar /tmp/apktool.jar b /tmp/apk_ -o /tmp/unaligned_.apk

            # Align & Sign
            zipalign -p -f -v 4 /tmp/unaligned_.apk /tmp/aligned_.apk
            apksigner sign --ks /tmp/caleb.jks --ks-pass pass:calebtv --key-pass pass:calebtv --out output/Caleb-TV-.apk /tmp/aligned_.apk
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caleb-TV-APK
          path: output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-Caleb
          name: Caleb TV v1.0.0
          body: |
            ## 🎬 Caleb TV 专属投影仪版
            - **视觉设计**：全新 Apple 极简风格，霓虹发光 Caleb 专属图标与大屏 16:9 横版海报
            - **应用名称**：Caleb
            - **底层引擎**：基于 FongMi 5.7.2 纯净硬解内核，支持 4K HDR、杜比视界及遥控器丝滑操控
            - **架构支持**：
              - ：适用于主流 64 位高性能投影仪及电视盒（极米、当贝、小米等）
              - ：适用于 32 位通用电视/投影芯片
          files: output/*.apk
