name: Build Caleb TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_apk.yml'
      - 'assets/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Caleb TV Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools & Python Pillow
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign apksigner wget curl jq || true
          pip install --break-system-packages pillow || sudo apt-get install -y python3-pil
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.0/apktool_2.11.0.jar -O /tmp/apktool.jar

      - name: Extract Apple-Grade Assets
        run: |
          python3 - << 'PYEOF'
          import base64
          from PIL import Image

          raw_bytes = base64.b64decode(open('assets/logo.b64').read().strip())
          with open('/tmp/raw.png', 'wb') as f:
              f.write(raw_bytes)

          raw = Image.open('/tmp/raw.png').convert('RGBA')

          # 16:9 Banner
          banner = Image.new('RGBA', (640, 360), (255, 255, 255, 255))
          logo_side = int(360 * 0.92)
          resized = raw.resize((logo_side, logo_side), Image.Resampling.LANCZOS)
          banner.paste(resized, ((640 - logo_side) // 2, (360 - logo_side) // 2), resized)
          banner.save('/tmp/banner.png')

          # App Icon
          ico = raw.resize((192, 192), Image.Resampling.LANCZOS)
          ico.save('/tmp/icon.png')
          print('Successfully generated Apple-grade banner and icon!')
          PYEOF
          file /tmp/banner.png /tmp/icon.png

      - name: Download Official FongMi Stable Leanback APKs
        run: |
          mkdir -p /tmp/bases
          curl -L -o /tmp/bases/arm64.apk 'https://github.com/FongMi/Release/releases/download/5.7.0/leanback-arm64_v8a.apk'
          curl -L -o /tmp/bases/v7a.apk 'https://github.com/FongMi/Release/releases/download/5.7.0/leanback-armeabi_v7a.apk'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore /tmp/caleb.jks -alias caleb -keyalg RSA -keysize 2048 -validity 10000 -storepass calebtv -keypass calebtv -dname 'CN=Caleb, OU=TV, O=Apple, L=Shanghai, S=Shanghai, C=CN'

      - name: Rebrand & Package APKs
        run: |
          mkdir -p output

          echo '=== Processing arm64 ==='
          java -jar /tmp/apktool.jar d -f -s /tmp/bases/arm64.apk -o /tmp/apk_arm64
          python3 - << 'PYARM64'
          import re, os, glob, shutil
          # 1. Strip pageSizeCompat safely
          p = '/tmp/apk_arm64/AndroidManifest.xml'
          if os.path.exists(p):
              txt = open(p, 'r', encoding='utf-8', errors='ignore').read()
              open(p, 'w', encoding='utf-8').write(re.sub(r'\s*android:pageSizeCompat="[^"]*"', '', txt))
          # 2. Rename App only in strings.xml containing app_name
          for f in glob.glob('/tmp/apk_arm64/res/**/strings.xml', recursive=True):
              c = open(f, 'r', encoding='utf-8', errors='ignore').read()
              if 'app_name' in c:
                  open(f, 'w', encoding='utf-8').write(re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Caleb</string>', c))
          # 3. Replace Banners & Icons safely
          for f in glob.glob('/tmp/apk_arm64/res/**/banner*.png', recursive=True):
              shutil.copy('/tmp/banner.png', f)
          for f in glob.glob('/tmp/apk_arm64/res/**/ic_launcher*.png', recursive=True):
              shutil.copy('/tmp/icon.png', f)
          print('arm64 resources updated successfully!')
          PYARM64
          java -jar /tmp/apktool.jar b /tmp/apk_arm64 -o /tmp/unaligned_arm64.apk
          zipalign -p -f -v 4 /tmp/unaligned_arm64.apk /tmp/aligned_arm64.apk
          apksigner sign --ks /tmp/caleb.jks --ks-pass pass:calebtv --key-pass pass:calebtv --out output/Caleb-TV-arm64.apk /tmp/aligned_arm64.apk

          echo '=== Processing v7a ==='
          java -jar /tmp/apktool.jar d -f -s /tmp/bases/v7a.apk -o /tmp/apk_v7a
          python3 - << 'PYV7A'
          import re, os, glob, shutil
          p = '/tmp/apk_v7a/AndroidManifest.xml'
          if os.path.exists(p):
              txt = open(p, 'r', encoding='utf-8', errors='ignore').read()
              open(p, 'w', encoding='utf-8').write(re.sub(r'\s*android:pageSizeCompat="[^"]*"', '', txt))
          for f in glob.glob('/tmp/apk_v7a/res/**/strings.xml', recursive=True):
              c = open(f, 'r', encoding='utf-8', errors='ignore').read()
              if 'app_name' in c:
                  open(f, 'w', encoding='utf-8').write(re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Caleb</string>', c))
          for f in glob.glob('/tmp/apk_v7a/res/**/banner*.png', recursive=True):
              shutil.copy('/tmp/banner.png', f)
          for f in glob.glob('/tmp/apk_v7a/res/**/ic_launcher*.png', recursive=True):
              shutil.copy('/tmp/icon.png', f)
          print('v7a resources updated successfully!')
          PYV7A
          java -jar /tmp/apktool.jar b /tmp/apk_v7a -o /tmp/unaligned_v7a.apk
          zipalign -p -f -v 4 /tmp/unaligned_v7a.apk /tmp/aligned_v7a.apk
          apksigner sign --ks /tmp/caleb.jks --ks-pass pass:calebtv --key-pass pass:calebtv --out output/Caleb-TV-v7a.apk /tmp/aligned_v7a.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caleb-TV-APK
          path: output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fongmi'
        with:
          tag_name: v1.0.0-Caleb
          name: Caleb TV v1.0.0
          body: |
            ## 🎬 Caleb TV 专属投影仪版
            - **视觉设计**：全新 Apple 极简风格，霓虹发光 Caleb 专属图标与大屏 16:9 横版海报
            - **应用名称**：Caleb
            - **底层引擎**：基于 FongMi 5.7.0 长期稳定版硬解内核，支持 4K HDR、杜比视界及遥控器丝滑操控
            - **架构支持**：
              - ：适用于主流 64 位高性能投影仪及电视盒（极米、当贝、小米等）
              - ：适用于 32 位通用电视/投影芯片
          files: output/*.apk
