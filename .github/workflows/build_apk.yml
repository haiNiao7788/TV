name: Build Caleb TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Caleb TV Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool wget curl jq python3-pil

      - name: Extract Apple-Grade Assets
        run: |
          python3 - << 'PYEOF'
          import base64, os
          from PIL import Image

          if os.path.exists('assets/logo.b64'):
              raw_bytes = base64.b64decode(open('assets/logo.b64').read().strip())
              with open('/tmp/raw.png', 'wb') as f:
                  f.write(raw_bytes)
              raw = Image.open('/tmp/raw.png').convert('RGBA')
          else:
              raw = Image.new('RGBA', (512, 512), (30, 30, 30, 255))

          banner = Image.new('RGBA', (640, 360), (20, 20, 22, 255))
          logo_side = int(360 * 0.85)
          resized = raw.resize((logo_side, logo_side), Image.Resampling.LANCZOS)
          banner.paste(resized, ((640 - logo_side) // 2, (360 - logo_side) // 2), resized)
          banner.save('/tmp/banner.png')

          ico = raw.resize((192, 192), Image.Resampling.LANCZOS)
          ico.save('/tmp/icon.png')
          print('Apple-grade assets generated successfully.')
          PYEOF

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore /tmp/caleb.jks -alias caleb -keyalg RSA -keysize 2048 -validity 10000 -storepass calebtv -keypass calebtv -dname 'CN=Caleb, OU=TV, O=Apple, L=Shanghai, S=Shanghai, C=CN'

      - name: Build Pure Caleb TV APKs (Apktool Clean Rebuild)
        run: |
          mkdir -p /tmp/bases output
          
          curl -L -o /tmp/bases/arm64.apk 'https://github.com/FongMi/Release/releases/download/5.7.0/leanback-arm64_v8a.apk'
          curl -L -o /tmp/bases/v7a.apk 'https://github.com/FongMi/Release/releases/download/5.7.0/leanback-armeabi_v7a.apk'

          for arch in v7a arm64; do
            echo "========== Processing ${arch} =========="
            work_dir="/tmp/apk_${arch}"
            rm -rf "${work_dir}"
            
            apktool d "/tmp/bases/${arch}.apk" -o "${work_dir}" -f

            find "${work_dir}/smali" -type f \( -name "*Updater*.smali" -o -name "*Release*.smali" \) | while read smali_file; do
              sed -i 's|https://api.github.com/repos/FongMi/Release/releases/latest|http://127.0.0.1:9999/disabled_update|g' "$smali_file"
              sed -i 's|https://api.github.com/repos/FongMi/Release/releases/tags/|http://127.0.0.1:9999/disabled_update/|g' "$smali_file"
            done

            find "${work_dir}/res" -type f -name "strings.xml" | while read str_file; do
              sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Caleb</string>|g' "$str_file"
            done

            find "${work_dir}/res" -type f -name "banner.png" -exec cp -f /tmp/banner.png {} \;
            find "${work_dir}/res" -type f -name "ic_launcher.png" -exec cp -f /tmp/icon.png {} \;

            rebuilt_apk="/tmp/rebuilt_${arch}.apk"
            apktool b "${work_dir}" -o "${rebuilt_apk}"

            aligned_apk="/tmp/aligned_${arch}.apk"
            final_apk="output/Caleb-TV-${arch}.apk"
            zipalign -p -f 4 "${rebuilt_apk}" "${aligned_apk}"
            apksigner sign --ks /tmp/caleb.jks --ks-pass pass:calebtv --key-pass pass:calebtv --out "${final_apk}" "${aligned_apk}"

            echo "Successfully generated: ${final_apk}"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caleb-TV-APK
          path: output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fongmi'
        with:
          tag_name: v1.0.1-Caleb
          name: Caleb TV v1.0.1 (纯净无更新·防卡死版)
          body: |
            ## 🎬 Caleb TV 专属投影仪版 (v1.0.1 修复版)
            - **彻底解除更新限制**：源码层已彻底拔除 GitHub 联网更新检测，永不弹窗提示更新。
            - **重构资源引擎**：使用 Apktool 标准编译重建资源池，彻底消除底层字符串越界与内存死锁。
            - **视觉设计**：全新 Apple 极简风格，霓虹发光 Caleb 专属图标与大屏 16:9 横版海报。
            - **应用名称**：Caleb。
            - **安装建议（重要）**：
              - ⚠️ **投影仪用户强烈建议优先安装**：`Caleb-TV-v7a.apk`（绝大多数投影仪为 32 位底层，装 v7a 流畅不掉帧）。
              - 64 位高性能电视盒子：可安装 `Caleb-TV-arm64.apk`。
          files: output/*.apk
