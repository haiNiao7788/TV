name: Build Caleb TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_apk.yml'
      - 'assets/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Caleb TV Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign apksigner wget curl jq || true
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.0/apktool_2.11.0.jar -O /tmp/apktool.jar

      - name: Extract Apple-Grade Assets
        run: |
          base64 -d assets/banner.b64 > /tmp/banner_640x360.png
          base64 -d assets/icon.b64 > /tmp/ic_192.png
          echo 'Assets extracted successfully!'

      - name: Download Official FongMi 5.7.2 Leanback APKs
        run: |
          mkdir -p /tmp/bases
          curl -L -o /tmp/bases/arm64.apk 'https://github.com/FongMi/Release/releases/download/5.7.2/leanback-arm64_v8a.apk'
          curl -L -o /tmp/bases/v7a.apk 'https://github.com/FongMi/Release/releases/download/5.7.2/leanback-armeabi_v7a.apk'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore /tmp/caleb.jks -alias caleb -keyalg RSA -keysize 2048 -validity 10000 -storepass calebtv -keypass calebtv -dname 'CN=Caleb, OU=TV, O=Apple, L=Shanghai, S=Shanghai, C=CN'

      - name: Rebrand & Package APKs
        run: |
          mkdir -p output

          for arch in arm64 v7a; do
            echo "=== Processing  ==="
            java -jar /tmp/apktool.jar d -f -s /tmp/bases/.apk -o /tmp/apk_

            # Fix Android 15 pageSizeCompat compatibility with aapt2
            sed -i 's/android:pageSizeCompat="enabled"//g' /tmp/apk_/AndroidManifest.xml || true

            # Rebrand App Name in all languages
            find /tmp/apk_/res -name 'strings.xml' | while read -r f; do
              sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Caleb<\/string>/g' "" || true
            done

            # Replace TV Banners & Icons with Apple-grade assets
            find /tmp/apk_/res -name '*banner*.png' | while read -r f; do
              cp -f /tmp/banner_640x360.png "" || true
            done
            find /tmp/apk_/res -name '*ic_launcher*.png' | while read -r f; do
              cp -f /tmp/ic_192.png "" || true
            done
            find /tmp/apk_/res -name '*ic_launcher_round*.png' | while read -r f; do
              cp -f /tmp/ic_192.png "" || true
            done
            find /tmp/apk_/res -name '*ic_launcher_round*.webp' | while read -r f; do
              cp -f /tmp/ic_192.png "" || true
            done

            # Build modified APK
            java -jar /tmp/apktool.jar b /tmp/apk_ -o /tmp/unaligned_.apk

            # Align & Sign
            zipalign -p -f -v 4 /tmp/unaligned_.apk /tmp/aligned_.apk
            apksigner sign --ks /tmp/caleb.jks --ks-pass pass:calebtv --key-pass pass:calebtv --out output/Caleb-TV-.apk /tmp/aligned_.apk
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caleb-TV-APK
          path: output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fongmi'
        with:
          tag_name: v1.0.0-Caleb
          name: Caleb TV v1.0.0
          body: |
            ## 🎬 Caleb TV 专属投影仪版
            - **视觉设计**：全新 Apple 极简风格，霓虹发光 Caleb 专属图标与大屏 16:9 横版海报
            - **应用名称**：Caleb
            - **底层引擎**：基于 FongMi 5.7.2 纯净硬解内核，支持 4K HDR、杜比视界及遥控器丝滑操控
            - **架构支持**：
              - ：适用于主流 64 位高性能投影仪及电视盒（极米、当贝、小米等）
              - ：适用于 32 位通用电视/投影芯片
          files: output/*.apk
