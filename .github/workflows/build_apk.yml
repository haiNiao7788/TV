name: Build Caleb TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_apk.yml'
      - 'app/src/main/assets/tv.json'
      - 'app/src/main/java/com/fongmi/android/tv/bean/Config.java'

permissions:
  contents: write

jobs:
  build:
    name: Build Caleb TV Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools & Python
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign apksigner wget curl jq || true
          pip install --break-system-packages pillow || sudo apt-get install -y python3-pil

      - name: Extract Apple-Grade Assets
        run: |
          python3 - << 'PYEOF'
          import base64
          from PIL import Image

          raw_bytes = base64.b64decode(open('assets/logo.b64').read().strip())
          with open('/tmp/raw.png', 'wb') as f:
              f.write(raw_bytes)

          raw = Image.open('/tmp/raw.png').convert('RGBA')

          # 16:9 Banner
          banner = Image.new('RGBA', (640, 360), (255, 255, 255, 255))
          logo_side = int(360 * 0.92)
          resized = raw.resize((logo_side, logo_side), Image.Resampling.LANCZOS)
          banner.paste(resized, ((640 - logo_side) // 2, (360 - logo_side) // 2), resized)
          banner.save('/tmp/banner.png')

          # App Icon
          ico = raw.resize((192, 192), Image.Resampling.LANCZOS)
          ico.save('/tmp/icon.png')
          print('Successfully generated Apple-grade banner and icon!')
          PYEOF

      - name: Generate Release Keystore & Local Properties
        run: |
          keytool -genkey -v -keystore /tmp/caleb.jks -alias caleb -keyalg RSA -keysize 2048 -validity 10000 -storepass calebtv -keypass calebtv -dname 'CN=Caleb, OU=TV, O=Apple, L=Shanghai, S=Shanghai, C=CN'
          echo "storeFile=/tmp/caleb.jks" > local.properties
          echo "keyAlias=caleb" >> local.properties
          echo "storePassword=calebtv" >> local.properties
          chmod +x gradlew

      - name: Try Gradle Official Source Build
        id: gradle_build
        continue-on-error: true
        run: |
          mkdir -p output
          ./gradlew assembleLeanbackRelease --stacktrace --no-daemon
          find app/build/outputs/apk -name "*.apk" -exec cp {} output/ ';'

      - name: Fallback to Lossless Direct Injection if Gradle Fails
        if: steps.gradle_build.outcome != 'success'
        run: |
          echo "Gradle build skipped or failed, using lossless direct injection engine..."
          mkdir -p /tmp/bases output
          curl -L -o /tmp/bases/arm64.apk 'https://github.com/FongMi/Release/releases/download/5.7.0/leanback-arm64_v8a.apk'
          curl -L -o /tmp/bases/v7a.apk 'https://github.com/FongMi/Release/releases/download/5.7.0/leanback-armeabi_v7a.apk'

          python3 - << 'PYINJECT'
          import zipfile, io, os

          banner_bytes = open('/tmp/banner.png', 'rb').read()
          icon_bytes = open('/tmp/icon.png', 'rb').read()
          tv_json_bytes = open('app/src/main/assets/tv.json', 'rb').read()

          for arch in ['arm64', 'v7a']:
              in_apk = f'/tmp/bases/{arch}.apk'
              temp_apk = f'/tmp/rebranded_{arch}.apk'
              print(f'Injecting Apple-grade assets into {arch}...')

              with zipfile.ZipFile(in_apk, 'r') as zin, zipfile.ZipFile(temp_apk, 'w', compression=zipfile.ZIP_DEFLATED) as zout:
                  # Inject internal tv.json so it supports assets://tv.json
                  zout.writestr('assets/tv.json', tv_json_bytes)

                  for item in zin.infolist():
                      fname = item.filename
                      if fname.startswith('META-INF/') and (fname.endswith('.SF') or fname.endswith('.RSA') or fname.endswith('.MF')):
                          continue

                      if 'banner' in fname.lower() and fname.endswith('.png'):
                          zout.writestr(item, banner_bytes)
                      elif 'ic_launcher' in fname.lower() and fname.endswith('.png'):
                          zout.writestr(item, icon_bytes)
                      elif fname == 'resources.arsc':
                          data = zin.read(fname)
                          data = data.replace('影视'.encode('utf-8'), 'Caleb'.encode('utf-8') + b' ')
                          zout.writestr(item, data)
                      else:
                          zout.writestr(item, zin.read(fname))

              aligned_apk = f'/tmp/aligned_{arch}.apk'
              final_apk = f'output/Caleb-TV-{arch}.apk'
              os.system(f'zipalign -p -f -v 4 {temp_apk} {aligned_apk}')
              os.system(f'apksigner sign --ks /tmp/caleb.jks --ks-pass pass:calebtv --key-pass pass:calebtv --out {final_apk} {aligned_apk}')
              print(f'Successfully built {final_apk}!')
          PYINJECT

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caleb-TV-APK
          path: output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fongmi'
        with:
          tag_name: v1.0.0-Caleb
          name: Caleb TV v1.0.0
          body: |
            ## 🎬 Caleb TV 专属投影仪版 (开箱即用免配置)
            - **视觉设计**：全新 Apple 极简风格，霓虹发光 Caleb 专属图标与大屏 16:9 横版海报
            - **应用名称**：Caleb
            - **内置接口**：已内置 LibreTV 极速解析源与聚合采集站（非凡、量子、无尽、极速蓝光），零门槛开箱即播
            - **底层引擎**：基于 FongMi 纯净硬解内核，支持 4K HDR、杜比视界及遥控器丝滑操控
            - **架构支持**：
              - Caleb-TV-arm64.apk：适用于主流 64 位高性能投影仪及电视盒（极米、当贝、小米等）
              - Caleb-TV-v7a.apk：适用于 32 位通用电视/投影芯片
          files: output/*.apk
