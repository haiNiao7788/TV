name: Build Caleb TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Caleb TV Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl jq python3-pil

      - name: Extract Apple-Grade Assets
        run: |
          python3 - << 'PYEOF'
          import base64, os
          from PIL import Image

          if os.path.exists('assets/logo.b64'):
              raw_bytes = base64.b64decode(open('assets/logo.b64').read().strip())
              with open('/tmp/raw.png', 'wb') as f:
                  f.write(raw_bytes)
              raw = Image.open('/tmp/raw.png').convert('RGBA')
          else:
              raw = Image.new('RGBA', (512, 512), (28, 28, 30, 255))

          banner = Image.new('RGBA', (640, 360), (18, 18, 20, 255))
          logo_side = int(360 * 0.88)
          resized = raw.resize((logo_side, logo_side), Image.Resampling.LANCZOS)
          banner.paste(resized, ((640 - logo_side) // 2, (360 - logo_side) // 2), resized)
          banner.save('/tmp/banner.png')

          ico = raw.resize((192, 192), Image.Resampling.LANCZOS)
          ico.save('/tmp/icon.png')
          print('Apple-grade assets generated successfully.')
          PYEOF

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore /tmp/caleb.jks -alias caleb -keyalg RSA -keysize 2048 -validity 10000 -storepass calebtv -keypass calebtv -dname 'CN=Caleb, OU=TV, O=Apple, L=Shanghai, S=Shanghai, C=CN'

      - name: Lossless Injection & Patch Engine
        run: |
          mkdir -p /tmp/bases output
          
          # 升级至官方最新 5.7.4 稳定版底包（彻底修复 5.7.0 的核心卡死与内存死锁 bug）
          curl -f -L -o /tmp/bases/arm64.apk 'https://github.com/FongMi/Release/releases/download/5.7.4/leanback-arm64_v8a.apk'
          curl -f -L -o /tmp/bases/v7a.apk 'https://github.com/FongMi/Release/releases/download/5.7.4/leanback-armeabi_v7a.apk'

          python3 - << 'PYINJECT'
          import zipfile, os

          banner_bytes = open('/tmp/banner.png', 'rb').read()
          icon_bytes = open('/tmp/icon.png', 'rb').read()
          
          # 等长精准 URL 替换（59字节与58字节），彻底切除更新链路且不影响 DEX 文件结构与偏移
          old_url1 = b'https://api.github.com/repos/FongMi/Release/releases/latest'
          new_url1 = b'http://127.0.0.1:9999/disabled_update_calebtv_never_check_x'
          
          old_url2 = b'https://api.github.com/repos/FongMi/Release/releases/tags/'
          new_url2 = b'http://127.0.0.1:9999/disabled_update_calebtv_tags_check1/'

          tv_json_bytes = b''
          if os.path.exists('app/src/main/assets/tv.json'):
              tv_json_bytes = open('app/src/main/assets/tv.json', 'rb').read()

          for arch in ['arm64', 'v7a']:
              in_apk = f'/tmp/bases/{arch}.apk'
              temp_apk = f'/tmp/patched_{arch}.apk'
              print(f'Patching & branding {arch} (Size: {os.path.getsize(in_apk)} bytes)...')

              with zipfile.ZipFile(in_apk, 'r') as zin, zipfile.ZipFile(temp_apk, 'w', compression=zipfile.ZIP_DEFLATED) as zout:
                  if tv_json_bytes:
                      zout.writestr('assets/tv.json', tv_json_bytes)

                  for item in zin.infolist():
                      fname = item.filename
                      if fname.startswith('META-INF/') and (fname.endswith('.SF') or fname.endswith('.RSA') or fname.endswith('.MF')):
                          continue

                      if 'banner' in fname.lower() and fname.endswith('.png'):
                          zout.writestr(item, banner_bytes)
                      elif 'ic_launcher' in fname.lower() and fname.endswith('.png'):
                          zout.writestr(item, icon_bytes)
                      elif fname.startswith('classes') and fname.endswith('.dex'):
                          dex_data = zin.read(fname)
                          if old_url1 in dex_data:
                              dex_data = dex_data.replace(old_url1, new_url1)
                          if old_url2 in dex_data:
                              dex_data = dex_data.replace(old_url2, new_url2)
                          zout.writestr(item, dex_data)
                      else:
                          zout.writestr(item, zin.read(fname))

              aligned_apk = f'/tmp/aligned_{arch}.apk'
              final_apk = f'output/Caleb-TV-{arch}.apk'
              os.system(f'zipalign -p -f 4 {temp_apk} {aligned_apk}')
              os.system(f'apksigner sign --ks /tmp/caleb.jks --ks-pass pass:calebtv --key-pass pass:calebtv --out {final_apk} {aligned_apk}')
              print(f'Successfully generated {final_apk}')
          PYINJECT

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caleb-TV-APK
          path: output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fongmi'
        with:
          tag_name: v1.0.1-Caleb
          name: Caleb TV v1.0.1 (5.7.4 稳定纯净版)
          body: |
            ## 🎬 Caleb TV 专属投影仪版 (v1.0.1)
            - **底层核心升级**：升级至 5.7.4 纯净内核，彻底根除 5.7.0 的核心卡死与内存死锁。
            - **拔除更新检测**：底层掐断 GitHub 版本接口，永不弹窗强更。
            - **视觉设计**：全新 Apple 极简暗黑风格，霓虹发光专属图标与 16:9 横版海报。
            - **安装建议（重要）**：
              - ⚠️ **投影仪用户请务必优先安装**：`Caleb-TV-v7a.apk`（完美兼容 32 位 Android 底层）。
              - 64 位高性能电视盒子：可安装 `Caleb-TV-arm64.apk`。
          files: output/*.apk
